# nginx inside the frontend container:
#  1. serves the built Angular app
#  2. acts as a simple API gateway: forwards /api/* to the right microservice
#  3. blocks the internal balance endpoint from the outside world
#
# This file is a template: at container start, ${NGINX_LOCAL_RESOLVERS} is replaced with
# the cluster DNS server from /etc/resolv.conf (feature of the official nginx image).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve service names on each request (not only at startup), so nginx does not
    # fail if cluster DNS is not ready yet when the pod starts.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
    set $account_service     http://account-service.svenskbank.svc.cluster.local:8081;
    set $transaction_service http://transaction-service.svenskbank.svc.cluster.local:8082;

    # Internal endpoint - only transaction-service may call it (inside the cluster)
    location ~ ^/api/accounts/[^/]+/balance {
        return 403;
    }

    location /api/accounts {
        proxy_pass $account_service;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/transactions {
        proxy_pass $transaction_service;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Angular routing: unknown paths go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
