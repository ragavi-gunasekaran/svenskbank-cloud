server:
  port: 8081

spring:
  application:
    name: account-service
  datasource:
    # All values come from environment variables (injected by Kubernetes).
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:accountdb}
    username: ${DB_USER:svenskbank}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update        # creates/updates tables automatically (fine for a study project)
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true         # /actuator/health/liveness and /readiness for Kubernetes
