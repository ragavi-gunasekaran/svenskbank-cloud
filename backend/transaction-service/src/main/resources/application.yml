server:
  port: 8082

spring:
  application:
    name: transaction-service
  datasource:
    # All values come from environment variables (injected by Kubernetes).
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:transactiondb}
    username: ${DB_USER:svenskbank}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

# Where account-service can be reached (Kubernetes service name inside the cluster).
account-service:
  url: ${ACCOUNT_SERVICE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
